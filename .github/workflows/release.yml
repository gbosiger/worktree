name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: ./work --root . check
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare exact-tag notes and source archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/prepare-release.py "$RELEASE_TAG" --output "$RUNNER_TEMP/release"
      - name: Smoke-test both source formats
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/smoke-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release"
      - name: Publish or update the tested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/publish-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release"
